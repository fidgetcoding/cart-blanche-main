# Name for the local Docker stack. Hosted projects are chosen with `supabase link`.
project_id = "cart-blanche"

[auth]
# Merchant accounts are by invitation, so a stranger can't create one.
enable_signup = false
site_url = "http://127.0.0.1:8080"
additional_redirect_urls = ["http://127.0.0.1:8080/demo/admin", "http://localhost:8080/demo/admin"]

# Log collection needs direct access to the Docker socket, which breaks on Colima
# and similar setups, and nothing here uses it.
[analytics]
enabled = false

# All four functions check their callers themselves: the shopper ones are public
# behind their rate limits, and smart-chat validates the merchant's token.
[functions.smartcart-chat]
verify_jwt = false

[functions.smart-chat]
verify_jwt = false

[functions.store-signup]
verify_jwt = false

[functions.chat-upload]
verify_jwt = false
